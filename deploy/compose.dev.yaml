# Local development stack for the Rust platform: PostgreSQL, Redis and
# S3-compatible MinIO. Test-only credentials; production provisioning sets real
# secrets out of band and never stores them in the repository.
name: businex-dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: businex
      POSTGRES_PASSWORD: businex_dev_only
      POSTGRES_DB: businex_dev
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businex -d businex_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:16391:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: businex
      MINIO_ROOT_PASSWORD: businex_dev_only
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  miniodata:
