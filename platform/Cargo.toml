[workspace]
resolver = "2"
members = [
  "crates/businex-core",
  "crates/businex-db",
  "crates/businex-queue",
  "crates/businex-events",
  "crates/businex-models",
  "crates/businex-api",
  "crates/businex-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/itsmaxjeffrey/businex.git"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
businex-core = { path = "crates/businex-core" }
businex-db = { path = "crates/businex-db" }
businex-events = { path = "crates/businex-events" }
businex-models = { path = "crates/businex-models" }
businex-queue = { path = "crates/businex-queue" }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
